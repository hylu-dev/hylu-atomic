# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: hylu-atomic
description: Minimal Fedora Atomic image with Niri, Noctalia Shell, and Noctalia Greeter for Nvidia hardware

base-image: ghcr.io/ublue-os/base-main
image-version: latest

modules:
  # Copy local configuration files into root /
  - type: files
    files:
      - source: system
        destination: /

  # Install Nvidia drivers (open kernel modules, Turing and later)
  - type: akmods
    base: main
    install: []
    nvidia-driver: nvidia-open

  # Install Terra repository
  - type: script
    snippets:
      - "dnf install -y --nogpgcheck --repofrompath 'terra,https://repos.fyralabs.com/terra44' terra-release"

  # Install system binaries from COPR and DNF
  - type: dnf
    repos:
      copr:
        - yalter/niri
    install:
      packages:
        - niri                     # Wayland Compositor
        - noctalia                 # Desktop Shell (v5, official Fedora package)
        - noctalia-greeter         # Native Noctalia Greeter for greetd
        - xwayland-satellite       # XWayland bridge for legacy apps
        - xdg-desktop-portal-gnome # Screen sharing & file pickers
        - greetd                   # Login daemon
        - foot                     # Terminal emulator
        - nautilus                 # File Manager
        - nix-core                 # Rootless Nix (store under ~/.local/share/nix, no /nix needed) — the Determinate installer's ostree support is currently broken by Fedora 42+'s composefs changes, so Nix has to be baked in at build time instead
        - nix-legacy               # Symlinks for classic nix-* commands (nix-env, nix-build, etc.) — needed by home-manager
    remove:
      packages:
        - firefox                  # Remove base RPM Firefox
        - alacritty                # Remove niri's recommended terminal (using foot instead)
        - waybar                   # Remove niri's recommended bar (using Noctalia instead)

  # Enable system services
  - type: systemd
    system:
      enabled:
        - greetd

  # Flatpak configuration
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - com.google.Chrome
      - scope: user

  # Cosign policy and image signature verification
  - type: signing
