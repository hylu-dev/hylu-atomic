# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: hylu-atomic
description: Minimal Fedora Atomic image with Umbriel, Noctalia Shell, and Noctalia Greeter for Nvidia hardware

base-image: ghcr.io/ublue-os/base-main
image-version: latest

modules:
  # Copy local configuration files into root /
  - type: files
    files:
      - source: system
        destination: /

  # Install Nvidia drivers (open kernel modules, Turing and later)
  - type: akmods
    base: main
    install: []
    nvidia-driver: nvidia-open

  # Install Terra repository
  - type: script
    snippets:
      - "dnf install -y --nogpgcheck --repofrompath \"terra,https://repos.fyralabs.com/terra$(rpm -E %fedora)\" terra-release"

  # Install system binaries from Terra and Fedora
  - type: dnf
    install:
      packages:
        - umbriel-nightly          # Wayland compositor (Terra, nightly builds); config in /etc/xdg/umbriel
        - xdg-desktop-portal-umbriel-nightly # Screencast/screenshot portal + share picker
        - xdg-desktop-portal-gtk   # File pickers etc. (umbriel-portals.conf: default=umbriel;gtk)
        - noctalia                 # Desktop Shell (v5, official Fedora package)
        - noctalia-greeter         # Native Noctalia Greeter for greetd
        - xwayland-satellite       # XWayland bridge for legacy apps
        - greetd                   # Login daemon
        - gnome-keyring            # Secret Service (Git Credential Manager etc.)
        - gnome-keyring-pam        # Unlocks the login keyring with the greetd password (pam.d/greetd already references it)
        - gpu-screen-recorder      # Screen recording backend for Noctalia
        - foot                     # Terminal emulator
        - nautilus                 # File Manager
        - zsh                      # Login shell (configured by hylu-nix)
        - nix                      # Multi-user Nix; /nix is bind-mounted from /var/lib/nix (see nix.mount) since the Determinate installer's ostree support is broken by composefs
        - nix-daemon               # Only a Recommends of nix, so list it explicitly
        - nix-legacy               # Classic nix-* commands (nix-env, nix-build, etc.), needed by home-manager
        - libxkbcommon-x11         # FMOD Studio AppImage (Qt xcb plugin) expects this from the host
        - xcb-util-keysyms         # FMOD Studio AppImage (Qt xcb plugin) expects this from the host
        - libatomic                # FMOD Studio links against libatomic.so.1; not bundled in its AppImage
        - fuse-libs                # libfuse2, so AppImages can run directly without --appimage-extract-and-run

  # Not wanted: Noctalia and foot replace these. Kept as a separate module so the
  # install step above can't pull them back in as weak deps (absent ones are a no-op).
  - type: dnf
    remove:
      packages:
        - firefox                  # Base RPM Firefox (Chrome is a Flatpak)
        - alacritty                # Terminal (foot)
        - waybar                   # Bar (Noctalia)
        - mako                     # Notifications; competes with Noctalia for org.freedesktop.Notifications
        - fuzzel                   # Launcher (Noctalia)
        - swaybg                   # Wallpaper (Noctalia)
        - swaylock                 # Lock screen (Noctalia)
        - swayidle                 # Idle/suspend (Noctalia)

  # SELinux labels for /nix, otherwise nix-daemon.socket is denied
  - type: script
    scripts:
      - nix-selinux.sh

  # Enable system services
  - type: systemd
    system:
      enabled:
        - greetd
        - nix.mount
        - nix-daemon.socket
    user:
      enabled:
        - hylu-setup.service       # First-login hylu-nix/home-manager setup

  # Flatpak configuration
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - com.google.Chrome
      - scope: user

  # Cosign policy and image signature verification
  - type: signing
