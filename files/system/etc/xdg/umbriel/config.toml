# hylu-atomic system Umbriel config
#
# Umbriel reads the first of these that exists (no merging):
#   ~/.config/umbriel/config.toml
#   /etc/xdg/umbriel/config.toml   <- this file
#   /usr/share/umbriel/config.toml
#
# To customize per-user, copy this file to ~/.config/umbriel/config.toml.
# Don't enable Noctalia's "umbriel" theme template unless you do: it creates a
# ~/.config/umbriel/config.toml that would shadow this file entirely.
#
# Check edits with `umbriel config validate`. Reference: https://docs.noctalia.dev/umbriel/

[include.optional]
files = ["~/.config/umbriel/noctalia.toml"]

# ==============================================================================
[general]
autostart = ["noctalia"]
show_cheatsheet = false

[events]
lid_close = "noctalia msg session lock"

# Published to the systemd user manager / D-Bus activation environment.
[environment]
TERMINAL = "foot"
LIBVA_DRIVER_NAME = "nvidia"
NVD_BACKEND = "direct"
ELECTRON_OZONE_PLATFORM_HINT = "auto"
QT_QPA_PLATFORM = "wayland"

# ==============================================================================
# Outputs (ignored on machines without these connectors)
[output.DP-1]
position = [0, 0]

[output.HDMI-A-1]
position = [1920, 0]

# ==============================================================================
# Border width/radius and unfocused color use Umbriel's defaults (2px, radius 10).
[colors.border]
focused = "#DDA0DDFF"   # plum

[appearance.shadow]
enabled = true

[appearance.blur]
radius = 3

# ==============================================================================
[input.keyboard]
repeat_delay = 600
repeat_rate = 25
numlock_toggle = true

[input.touchpad]
tap = true
natural_scroll = true

[input.focus]
follows_mouse = true
# Hover never scrolls the layout: only fully visible windows take focus on hover.
follows_mouse_max_scroll = 0.0

[input.cursor]
follows_focus = true

# ==============================================================================
[layout]
gap = 8
extent_presets = [0.333, 0.5, 0.667]

[layout.scrolling]
default_extent_fraction = 0.5

# ==============================================================================
# Keybinds: defining this table replaces Umbriel's built-in set.
# Umbriel's default binds (examples/config.toml) plus a few marked "custom".
[keybinds]

# Applications and session
"Mod+Return" = { action = "spawn foot", repeat = false }  # default: kitty (not installed)
"Mod+E" = { action = "spawn nautilus", repeat = false }   # custom
"Mod+D" = { action = "spawn noctalia msg panel-toggle launcher", repeat = false }  # custom
"Mod+Q" = { action = "window-close", repeat = false }
"Mod+Escape" = "session-quit"
"Mod+Shift+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }
"Mod+Alt+L" = { action = "spawn noctalia msg session lock", repeat = false }  # custom

# Screenshots via Noctalia (Umbriel has no built-in screenshot actions)  # custom
"Print" = { action = "spawn noctalia msg screenshot-region", repeat = false }
"Mod+Shift+S" = { action = "spawn noctalia msg screenshot-region", repeat = false }
"Ctrl+Print" = { action = "spawn noctalia msg screenshot-fullscreen", repeat = false }
"Shift+Print" = { action = "spawn noctalia msg screenshot-fullscreen all", repeat = false }
"Alt+Print" = { action = "spawn noctalia msg screenshot-annotate", repeat = false }

# Media, volume and brightness keys from any input device, routed through the
# Noctalia shell so its OSDs show. Safe while the session is locked.
# https://docs.noctalia.dev/noctalia/compositor-settings/umbriel
"XF86AudioRaiseVolume" = { action = "spawn noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn noctalia msg media next", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn noctalia msg media previous", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn noctalia msg brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn noctalia msg brightness-down", allow_when_locked = true }

# Focus and movement
"Mod+Left" = "window-focus-or-output-left"    # custom: crosses monitors at the edge
"Mod+Down" = "window-focus-or-workspace-down"  # custom: next workspace at the edge
"Mod+Up" = "window-focus-or-workspace-up"      # custom
"Mod+Right" = "window-focus-or-output-right"  # custom
"Mod+H" = "window-focus-or-output-left"       # custom
"Mod+J" = "window-focus-or-workspace-down"     # custom
"Mod+K" = "window-focus-or-workspace-up"       # custom
"Mod+L" = "window-focus-or-output-right"      # custom
"Mod+F1" = "window-focus-next"
"Mod+Shift+Left" = "column-move-left"
"Mod+Shift+Down" = "window-move-or-workspace-down"  # custom: next workspace at the edge
"Mod+Shift+Up" = "window-move-or-workspace-up"      # custom
"Mod+Shift+Right" = "column-move-right"
"Mod+Shift+H" = "column-move-left"   # custom
"Mod+Shift+J" = "window-move-or-workspace-down"   # custom
"Mod+Shift+K" = "window-move-or-workspace-up"     # custom
"Mod+Shift+L" = "column-move-right"  # custom
# Monitors (custom)
"Mod+Ctrl+Left" = "output-focus-left"
"Mod+Ctrl+Right" = "output-focus-right"
"Mod+Shift+Ctrl+Left" = "column-move-to-output-left"
"Mod+Shift+Ctrl+Right" = "column-move-to-output-right"

# Window state and layout
"Mod+T" = { action = "window-toggle-floating", repeat = false }
"Mod+Shift+T" = { action = "window-focus-switch-floating", repeat = false }
"Mod+P" = { action = "window-toggle-pinned", repeat = false }
"Mod+M" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+Ctrl+F" = { action = "window-toggle-maximize", repeat = false }
"Mod+R" = "window-cycle-primary-extent"
"Mod+Shift+R" = "window-cycle-primary-extent-back"
"Mod+Comma" = "window-consume-left"
"Mod+Period" = "window-consume-right"
"Mod+Ctrl+Comma" = "window-consume-from-left"
"Mod+Ctrl+Period" = "window-consume-from-right"
"Mod+Alt+Space" = { action = "workspace-set-layout toggle", repeat = false }  # custom: cycle scrolling/dwindle/master/stacking
# Needs layout.mode = "dwindle".
# "Mod+Alt+T" = "layout-toggle-split"
"Mod+W" = { action = "column-toggle-tabbed", repeat = false }
"Mod+Alt+Right" = "column-focus-tab-next"
"Mod+Alt+Left" = "column-focus-tab-previous"
"Mod+WheelUp" = "window-focus-left"
"Mod+WheelDown" = "window-focus-right"
"Mod+Shift+WheelDown" = { action = "workspace-next", cooldown_ms = 150 }      # custom
"Mod+Shift+WheelUp" = { action = "workspace-previous", cooldown_ms = 150 }    # custom
"Mod+O" = { action = "overview-toggle", repeat = false }
"Mod+Space" = { action = "overview-toggle", repeat = false }  # custom (default: scratchpad-toggle)

# Workspaces
# Move the whole workspace, retaining its name, layout, and windows.
# "Mod+Ctrl+Page_Down" = "workspace-move-to-output-next"
# "Mod+Ctrl+Page_Up" = "workspace-move-to-output-previous"
# "Mod+Ctrl+W" = "workspace-move-to-output current WEB --output DP-1"
"Mod+Page_Down" = "workspace-next"     # custom
"Mod+Page_Up" = "workspace-previous"   # custom
"Mod+U" = "workspace-next"             # custom
"Mod+I" = "workspace-previous"         # custom
"Mod+1" = "workspace-switch 1"
"Mod+2" = "workspace-switch 2"
"Mod+3" = "workspace-switch 3"
"Mod+4" = "workspace-switch 4"
"Mod+5" = "workspace-switch 5"
"Mod+6" = "workspace-switch 6"
"Mod+7" = "workspace-switch 7"
"Mod+8" = "workspace-switch 8"
"Mod+9" = "workspace-switch 9"
"Mod+Shift+1" = "window-move-to-workspace 1"
"Mod+Shift+2" = "window-move-to-workspace 2"
"Mod+Shift+3" = "window-move-to-workspace 3"
"Mod+Shift+4" = "window-move-to-workspace 4"
"Mod+Shift+5" = "window-move-to-workspace 5"
"Mod+Shift+6" = "window-move-to-workspace 6"
"Mod+Shift+7" = "window-move-to-workspace 7"
"Mod+Shift+8" = "window-move-to-workspace 8"
"Mod+Shift+9" = "window-move-to-workspace 9"

# Scratchpad
"Mod+Shift+Space" = { action = "window-move-to-scratchpad", repeat = false }
"Mod+S" = "scratchpad-toggle"  # custom (default: Mod+Space)
"Mod+Ctrl+Space" = { action = "window-restore-from-scratchpad", repeat = false }
"Mod+Tab" = "scratchpad-focus-next"

# ==============================================================================
# Window rules
[[window_rule]]
match.app_id = "^dev\\.noctalia\\.Noctalia(\\.Settings)?$"
default_floating = true
default_floating_size_px = { width = 1080, height = 920 }

[[window_rule]]
match.app_id = "^dev\\.noctalia\\.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

# ==============================================================================
# Layer rules: blur Noctalia surfaces
[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true

[[layer_rule]]
match.namespace = "^noctalia-(notification|dock|panel|attached-panel|osd)$"
blur_optimized = false

# ==============================================================================
[hot_corners.top_left]
enabled = true
delay_ms = 500
action = "overview-open"
