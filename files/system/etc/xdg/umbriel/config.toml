# hylu-atomic system Umbriel config
#
# Umbriel reads the first of these that exists (no merging):
#   ~/.config/umbriel/config.toml
#   /etc/xdg/umbriel/config.toml   <- this file
#   /usr/share/umbriel/config.toml
#
# To customize per-user, copy this file to ~/.config/umbriel/config.toml.
# Don't enable Noctalia's "umbriel" theme template unless you do: it creates a
# ~/.config/umbriel/config.toml that would shadow this file entirely.
#
# Check edits with `umbriel config validate`. Reference: https://docs.noctalia.dev/umbriel/

[include.optional]
files = ["~/.config/umbriel/noctalia.toml"]

# ==============================================================================
[general]
autostart = ["noctalia"]
show_cheatsheet = false

[events]
lid_close = "noctalia msg session lock"

# Published to the systemd user manager / D-Bus activation environment.
[environment]
TERMINAL = "foot"
LIBVA_DRIVER_NAME = "nvidia"
NVD_BACKEND = "direct"
ELECTRON_OZONE_PLATFORM_HINT = "auto"
QT_QPA_PLATFORM = "wayland"

# ==============================================================================
# Outputs (ignored on machines without these connectors)
[output.DP-1]
position = [0, 0]

[output.HDMI-A-1]
position = [1920, 0]

# ==============================================================================
[appearance]
border_width = 1
corner_radius = 20

[appearance.shadow]
enabled = true

[appearance.blur]
radius = 3

[colors.border]
focused = "#DDA0DDFF"   # plum
unfocused = "#505050FF"

# ==============================================================================
[input.keyboard]
repeat_delay = 600
repeat_rate = 25
numlock_toggle = true

[input.touchpad]
tap = true
natural_scroll = true

[input.focus]
follows_mouse = true

[input.cursor]
follows_focus = true

# ==============================================================================
[layout]
gap = 8
extent_presets = [0.333, 0.5, 0.667]

[layout.scrolling]
default_extent_fraction = 0.5

# ==============================================================================
# Keybinds: defining this table replaces Umbriel's built-in set.
# Mirrors the previous niri config.
[keybinds]
# Apps / shell
"Mod+Return" = { action = "spawn foot", repeat = false }
"Mod+T" = { action = "spawn foot", repeat = false }
"Mod+D" = { action = "spawn noctalia msg panel-toggle launcher", repeat = false }
"Mod+Comma" = { action = "spawn noctalia msg settings-toggle", repeat = false }
"Mod+Period" = { action = "spawn noctalia msg panel-toggle control-center", repeat = false }
"Mod+E" = { action = "spawn nautilus", repeat = false }
"Super+Alt+L" = { action = "spawn noctalia msg session lock", repeat = false }
"Mod+Q" = { action = "window-close", repeat = false }
"Mod+Shift+E" = { action = "session-quit", repeat = false }
"Mod+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }
"Mod+Shift+Slash" = { action = "cheatsheet-toggle", repeat = false }
"Mod+Space" = { action = "overview-toggle", repeat = false }

# Screenshots (Noctalia)
"Print" = { action = "spawn noctalia msg screenshot-region", repeat = false }
"Ctrl+Print" = { action = "spawn noctalia msg screenshot-fullscreen", repeat = false }
"Alt+Print" = { action = "spawn noctalia msg screenshot-annotate", repeat = false }

# Media keys
"XF86AudioRaiseVolume" = { action = "spawn noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioMicMute" = { action = "spawn noctalia msg mic-mute", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioStop" = { action = "spawn noctalia msg media stop", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn noctalia msg media next", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn noctalia msg media previous", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn noctalia msg brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn noctalia msg brightness-down", allow_when_locked = true }

# Focus
"Mod+H" = "window-focus-left"
"Mod+L" = "window-focus-right"
"Mod+J" = "window-focus-or-workspace-down"
"Mod+K" = "window-focus-or-workspace-up"
"Mod+Left" = "window-focus-left"
"Mod+Right" = "window-focus-right"
"Mod+Down" = "window-focus-or-workspace-down"
"Mod+Up" = "window-focus-or-workspace-up"
"Mod+Home" = "column-focus-first"
"Mod+End" = "column-focus-last"

# Move
"Mod+Shift+H" = "column-move-left"
"Mod+Shift+L" = "column-move-right"
"Mod+Shift+J" = "window-move-or-workspace-down"
"Mod+Shift+K" = "window-move-or-workspace-up"
"Mod+Shift+Left" = "column-move-left"
"Mod+Shift+Right" = "column-move-right"
"Mod+Shift+Down" = "window-move-or-workspace-down"
"Mod+Shift+Up" = "window-move-or-workspace-up"
"Mod+Shift+Home" = "column-move-to-first"
"Mod+Shift+End" = "column-move-to-last"

# Monitors
"Mod+Ctrl+H" = "output-focus-left"
"Mod+Ctrl+L" = "output-focus-right"
"Mod+Ctrl+J" = "output-focus-down"
"Mod+Ctrl+K" = "output-focus-up"
"Mod+Ctrl+Left" = "output-focus-left"
"Mod+Ctrl+Right" = "output-focus-right"
"Mod+Ctrl+Down" = "output-focus-down"
"Mod+Ctrl+Up" = "output-focus-up"
"Mod+Shift+Ctrl+H" = "column-move-to-output-left"
"Mod+Shift+Ctrl+L" = "column-move-to-output-right"
"Mod+Shift+Ctrl+J" = "column-move-to-output-down"
"Mod+Shift+Ctrl+K" = "column-move-to-output-up"
"Mod+Shift+Ctrl+Left" = "column-move-to-output-left"
"Mod+Shift+Ctrl+Right" = "column-move-to-output-right"
"Mod+Shift+Ctrl+Down" = "column-move-to-output-down"
"Mod+Shift+Ctrl+Up" = "column-move-to-output-up"

# Workspaces
"Mod+U" = "workspace-next"
"Mod+I" = "workspace-previous"
"Mod+Page_Down" = "workspace-next"
"Mod+Page_Up" = "workspace-previous"
"Mod+Ctrl+U" = "column-move-to-workspace-next"
"Mod+Ctrl+I" = "column-move-to-workspace-previous"
"Mod+Ctrl+Page_Down" = "column-move-to-workspace-next"
"Mod+Ctrl+Page_Up" = "column-move-to-workspace-previous"
"Mod+Shift+U" = "workspace-move-down"
"Mod+Shift+I" = "workspace-move-up"
"Mod+1" = "workspace-switch 1"
"Mod+2" = "workspace-switch 2"
"Mod+3" = "workspace-switch 3"
"Mod+4" = "workspace-switch 4"
"Mod+5" = "workspace-switch 5"
"Mod+6" = "workspace-switch 6"
"Mod+7" = "workspace-switch 7"
"Mod+8" = "workspace-switch 8"
"Mod+9" = "workspace-switch 9"
"Mod+Shift+1" = "column-move-to-workspace 1"
"Mod+Shift+2" = "column-move-to-workspace 2"
"Mod+Shift+3" = "column-move-to-workspace 3"
"Mod+Shift+4" = "column-move-to-workspace 4"
"Mod+Shift+5" = "column-move-to-workspace 5"
"Mod+Shift+6" = "column-move-to-workspace 6"
"Mod+Shift+7" = "column-move-to-workspace 7"
"Mod+Shift+8" = "column-move-to-workspace 8"
"Mod+Shift+9" = "column-move-to-workspace 9"

# Layout mode (Umbriel-specific): cycle scrolling -> dwindle -> master -> stacking
"Mod+Shift+Space" = { action = "workspace-set-layout toggle", repeat = false }

# Columns
"Mod+BracketLeft" = "window-consume-or-expel-left"
"Mod+BracketRight" = "window-consume-or-expel-right"
"Mod+W" = { action = "column-toggle-tabbed", repeat = false }
"Mod+C" = "column-center"

# Sizing
"Mod+R" = "window-cycle-primary-extent"
"Mod+Shift+R" = "window-cycle-primary-extent-back"
"Mod+Ctrl+R" = "window-cycle-secondary-extent"
"Mod+Minus" = "window-modify-primary-extent -0.1"
"Mod+Equal" = "window-modify-primary-extent 0.1"
"Mod+A" = "window-modify-primary-extent -0.1"
"Mod+S" = "window-modify-primary-extent 0.1"
"Mod+Shift+Minus" = "window-modify-secondary-extent -0.1"
"Mod+Shift+Equal" = "window-modify-secondary-extent 0.1"
"Mod+Shift+A" = "window-modify-secondary-extent -0.1"
"Mod+Shift+S" = "window-modify-secondary-extent 0.1"

# Window state
"Mod+F" = { action = "window-toggle-maximize", repeat = false }
"Mod+Shift+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+Ctrl+F" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+V" = { action = "window-toggle-floating", repeat = false }
"Mod+Shift+V" = { action = "window-focus-switch-floating", repeat = false }

# Mouse (mouse/wheel binds need a modifier)
"Mod+MouseBack" = "window-focus-left"
"Mod+MouseForward" = "window-focus-right"
"Mod+WheelDown" = { action = "workspace-next", cooldown_ms = 150 }
"Mod+WheelUp" = { action = "workspace-previous", cooldown_ms = 150 }
"Mod+Shift+WheelDown" = "window-focus-right"
"Mod+Shift+WheelUp" = "window-focus-left"
"Mod+Ctrl+WheelDown" = { action = "column-move-to-workspace-next", cooldown_ms = 150 }
"Mod+Ctrl+WheelUp" = { action = "column-move-to-workspace-previous", cooldown_ms = 150 }

# ==============================================================================
# Window rules
[[window_rule]]
match.app_id = "^dev\\.noctalia\\.Noctalia(\\.Settings)?$"
default_floating = true
default_floating_size_px = { width = 1080, height = 920 }

[[window_rule]]
match.app_id = "^dev\\.noctalia\\.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

# ==============================================================================
# Layer rules: blur Noctalia surfaces
[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true

[[layer_rule]]
match.namespace = "^noctalia-(notification|dock|panel|attached-panel|osd)$"
blur_optimized = false

# ==============================================================================
[hot_corners.top_left]
enabled = true
delay_ms = 500
action = "overview-open"
