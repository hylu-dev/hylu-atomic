# The noctalia-greeter RPM doesn't create its state dir, and /var isn't part of
# the image. Without it, "Sync to greeter" in Noctalia fails with
# "failed to open the greeter state directory". Owner matches the greetd
# session user in /etc/greetd/config.toml (as setup_greeter_system.sh does).
d /var/lib/noctalia-greeter 0750 greetd greetd -
