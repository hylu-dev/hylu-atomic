# The RPM creates these in the image's /nix, but nix.mount hides them, so
# recreate them on the writable bind (modes match the nix-system package).
d /nix/store             1775 root nixbld -
d /nix/var/nix           0775 root nixbld -
d /nix/var/log/nix/drvs  0775 root nixbld -
# Restore the SELinux label (var_run_t, see nix-selinux.sh) on every boot so
# nix-daemon.socket can be created even if the dir predates the policy.
d /nix/var/nix/daemon-socket 0755 root root -
